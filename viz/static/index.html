<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPPI Planner Visualizer</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Ensure the canvas container fills available space */
    #konva-container canvas {
      border-radius: 0.5rem;
    }
  </style>
</head>
<body class="h-screen bg-base-100 flex flex-col overflow-hidden">

  <!-- Navbar -->
  <div class="navbar bg-base-300 shadow-lg px-4">
    <div class="flex-1">
      <span class="text-xl font-bold tracking-tight">MPPI Planner Visualizer</span>
    </div>
    <div class="flex-none">
      <span class="badge badge-ghost badge-sm">dark theme</span>
    </div>
  </div>

  <!-- Main 3-column layout -->
  <main
    class="flex flex-1 overflow-hidden"
    x-data="{
      // Dynamics
      dynamics: 'holonomic',
      dynamicsKwargs: {},
      dynamicsInfo: {},

      // MPPI
      dt: 0.05,
      n_rollouts: 2048,
      sigma: 0.15,
      lam: 0.005,
      horizon_knots: 10,
      num_intermediate: 8,

      // Steer sigma (0 = same as sigma)
      steer_sigma: 0.03,

      // Cost weights
      goal_pos_weight: 5000.0,
      goal_heading_weight: 200.0,
      goal_vel_weight: 100.0,
      collision_weight: 30.0,
      collision_decay: 3.0,
      collision_inside_weight: 300.0,
      smoothness_weight: 30.0,
      terminal_weight: 10.0,
      control_reg_weight: 0.1,
      sign_change_weight: 50.0,
      goal_reach_reward: 0.0,
      goal_reach_threshold: 0.1,
      goalRewardTriggered: false,

      // MPPI backend
      backend: 'spline',
      // Adaptive MPPI (mppi_torch-style, used when backend='torch')
      gamma_sigma: 0.5,
      cov_floor: 0.001,

      // Map
      resolution: 0.05,
      inflate_radius: 0.15,

      // Planning
      use_global_planner: true,
      global_planner_type: 'rrt',

      // Convergence
      goal_tolerance: 0.05,
      stop_threshold: 0.08,
      max_steps: 300,
      replan_interval: 1,

      // Drawing state
      drawMode: 'rect',

      // Planning state
      planning: false,
      playing: false,
      canPlay: false,
      statusText: 'Ready',
      currentStep: 0,
      posError: null,
      yawError: null,

      // Methods
      async startPlanning() {
        if (this.planning) return;
        this.planning = true;
        this.statusText = 'Planning...';
        this.currentStep = 0;
        this.posError = null;
        this.yawError = null;
        this.goalRewardTriggered = false;
        try {
          const params = new URLSearchParams({
            dynamics: this.dynamics,
            dt: this.dt,
            n_rollouts: this.n_rollouts,
            sigma: this.sigma,
            lam: this.lam,
            horizon_knots: this.horizon_knots,
            num_intermediate: this.num_intermediate,
            goal_pos_weight: this.goal_pos_weight,
            goal_heading_weight: this.goal_heading_weight,
            goal_vel_weight: this.goal_vel_weight,
            collision_weight: this.collision_weight,
            collision_decay: this.collision_decay,
            collision_inside_weight: this.collision_inside_weight,
            smoothness_weight: this.smoothness_weight,
            terminal_weight: this.terminal_weight,
            control_reg_weight: this.control_reg_weight,
            sign_change_weight: this.sign_change_weight,
            goal_reach_reward: this.goal_reach_reward,
            goal_reach_threshold: this.goal_reach_threshold,
            backend: this.backend,
            gamma_sigma: this.gamma_sigma,
            cov_floor: this.cov_floor,
            steer_sigma: this.steer_sigma,
            resolution: this.resolution,
            inflate_radius: this.inflate_radius,
            use_global_planner: this.use_global_planner,
            global_planner_type: this.global_planner_type,
            goal_tolerance: this.goal_tolerance,
            stop_threshold: this.stop_threshold,
            max_steps: this.max_steps,
            replan_interval: this.replan_interval,
          });
          // Append dynamics kwargs directly (backend expects wheelbase, dt_fwd, etc.)
          for (const [key, val] of Object.entries(this.dynamicsKwargs)) {
            params.set(key, val);
          }
          // Reset charts
          const labels = ACTION_LABELS[this.dynamics] || ['a0', 'a1', 'a2'];
          if (window.resetCharts) window.resetCharts(labels);
          const url = '/api/plan?' + params.toString();
          if (window.startPlanning) {
            await window.startPlanning(url);
          }
        } catch (e) {
          this.statusText = 'Error: ' + e.message;
        } finally {
          this.planning = false;
        }
      },

      async playAnimation() {
        if (this.playing || !this.canPlay) return;
        this.playing = true;
        this.statusText = 'Playing...';
        this.currentStep = 0;
        this.posError = null;
        this.yawError = null;
        const labels = ACTION_LABELS[this.dynamics] || ['a0', 'a1', 'a2'];
        if (window.resetCharts) window.resetCharts(labels);
        if (window.playTrajectory) await window.playTrajectory();
        this.playing = false;
      },

      clearAll() {
        this.currentStep = 0;
        this.posError = null;
        this.yawError = null;
        this.statusText = 'Ready';
        this.canPlay = false;
        this.playing = false;
        if (window.clearCanvas) window.clearCanvas();
      },

      loadPreset(name) {
        const PRESETS = {
          // Straight line: no obstacles, sanity check
          straight: {
            scene: {
              boxes: [], circles: [],
              start: [-2.0, 0.0, 0.0],
              goal: [2.0, 0.0, 0.0],
            },
            dynamics: 'unicycle', kwargs: { wheelbase: 0.3 },
            dt: 0.15, n_rollouts: 4096, sigma: 0.15, steer_sigma: 0.001, lam: 0.05,
            horizon_knots: 4, num_intermediate: 18,
            goal_pos_weight: 5000.0, goal_heading_weight: 200.0, goal_vel_weight: 100.0,
            collision_weight: 0.0, collision_decay: 3.0,
            collision_inside_weight: 0.0, smoothness_weight: 10.0,
            goal_tolerance: 0.05, max_steps: 400,
          },
          // Lane change: drive around a center obstacle
          lane_change: {
            scene: {
              boxes: [[-0.3, -0.6, 0.3, 0.6]],
              circles: [],
              start: [-2.0, 0.0, 0.0],
              goal: [2.0, 0.0, 0.0],
            },
            dynamics: 'unicycle', kwargs: { wheelbase: 0.3 },
            dt: 0.15, n_rollouts: 4096, sigma: 0.15, steer_sigma: 0.03, lam: 0.05,
            horizon_knots: 12, num_intermediate: 6,
            goal_pos_weight: 5000.0, goal_heading_weight: 200.0, goal_vel_weight: 100.0,
            collision_weight: 30.0, collision_decay: 3.0,
            collision_inside_weight: 300.0, smoothness_weight: 30.0,
            goal_tolerance: 0.05, max_steps: 400,
          },
          // S-curve: navigate between two offset walls
          s_curve: {
            scene: {
              boxes: [[-0.8, -0.3, 0.0, 2.0], [0.0, -2.0, 0.8, 0.3]],
              circles: [],
              start: [-2.0, 1.0, 0.0],
              goal: [2.0, -1.0, 0.0],
            },
            dynamics: 'unicycle', kwargs: { wheelbase: 0.3 },
            dt: 0.15, n_rollouts: 4096, sigma: 0.15, steer_sigma: 0.03, lam: 0.05,
            horizon_knots: 12, num_intermediate: 6,
            goal_pos_weight: 5000.0, goal_heading_weight: 200.0, goal_vel_weight: 100.0,
            collision_weight: 30.0, collision_decay: 3.0,
            collision_inside_weight: 300.0, smoothness_weight: 30.0,
            goal_tolerance: 0.05, max_steps: 500,
          },
          // Slalom: weave between staggered circular pillars
          slalom: {
            scene: {
              boxes: [],
              circles: [[-1.0, 0.8, 0.25], [0.0, -0.8, 0.25], [1.0, 0.8, 0.25]],
              start: [-2.0, 0.0, 0.0],
              goal: [2.0, 0.0, 0.0],
            },
            dynamics: 'unicycle', kwargs: { wheelbase: 0.3 },
            dt: 0.15, n_rollouts: 4096, sigma: 0.15, steer_sigma: 0.03, lam: 0.05,
            horizon_knots: 12, num_intermediate: 6,
            goal_pos_weight: 5000.0, goal_heading_weight: 200.0, goal_vel_weight: 100.0,
            collision_weight: 30.0, collision_decay: 3.0,
            collision_inside_weight: 300.0, smoothness_weight: 30.0,
            goal_tolerance: 0.05, max_steps: 500,
          },
        };
        const p = PRESETS[name];
        if (!p) return;
        // Apply scene
        if (window.loadPreset) window.loadPreset(p.scene);
        // Apply params
        this.backend = p.backend || 'spline';
        this.dynamics = p.dynamics;
        this.dynamicsKwargs = { ...p.kwargs };
        this.dt = p.dt;
        this.n_rollouts = p.n_rollouts;
        this.sigma = p.sigma;
        this.steer_sigma = p.steer_sigma || 0.05;
        this.lam = p.lam;
        this.horizon_knots = p.horizon_knots;
        this.num_intermediate = p.num_intermediate;
        this.goal_pos_weight = p.goal_pos_weight;
        this.goal_heading_weight = p.goal_heading_weight;
        this.goal_vel_weight = p.goal_vel_weight || 0;
        this.collision_weight = p.collision_weight;
        this.collision_decay = p.collision_decay;
        this.collision_inside_weight = p.collision_inside_weight;
        this.smoothness_weight = p.smoothness_weight;
        this.terminal_weight = p.terminal_weight || 10.0;
        this.control_reg_weight = p.control_reg_weight || 0.1;
        this.sign_change_weight = p.sign_change_weight || 50.0;
        this.goal_reach_reward = 0.0;
        this.goal_reach_threshold = 0.1;
        this.replan_interval = p.replan_interval || 1;
        this.gamma_sigma = p.gamma_sigma || 0.7;
        this.cov_floor = p.cov_floor || 0.001;
        this.stop_threshold = p.stop_threshold || 0.08;
        this.use_global_planner = p.use_global_planner !== undefined ? p.use_global_planner : true;
        this.global_planner_type = p.global_planner_type || 'rrt';
        this.goal_tolerance = p.goal_tolerance;
        this.max_steps = p.max_steps;
        this.canPlay = false;
        this.statusText = 'Preset loaded — hit Plan & Go';
      },

      updateDynamicsKwargs() {
        const info = this.dynamicsInfo[this.dynamics];
        if (info) this.dynamicsKwargs = { ...info.kwargs };
      },

      async init() {
        const self = this;
        try {
          const resp = await fetch('/api/dynamics');
          this.dynamicsInfo = await resp.json();
          this.updateDynamicsKwargs();
        } catch (e) {
          console.warn('Could not fetch dynamics info:', e);
        }
        // Initialize canvas (planner.js)
        if (window.initCanvas) window.initCanvas();
        // Initialize charts (charts.js)
        if (window.initCharts) window.initCharts();
        // Listen for planner events from planner.js
        window.addEventListener('planner-done', function (e) {
          const d = e.detail || {};
          self.planning = false;
          if (d.status === 'Error') {
            self.statusText = 'Error';
          } else {
            self.statusText = 'Planned (' + (d.steps || '?') + ' steps) — hit Play';
            self.canPlay = true;
          }
        });
        // Listen for playback step events
        window.addEventListener('playback-step', function (e) {
          const d = e.detail;
          self.currentStep = d.step;
          self.posError = d.pos_error;
          self.yawError = d.heading_error;
          self.goalRewardTriggered = d.goal_reward_triggered || false;
          if (window.updateCharts) {
            window.updateCharts({ step: d.step, pos_err: d.pos_error, action: d.action });
          }
        });
        window.addEventListener('playback-done', function () {
          self.playing = false;
          self.statusText = 'Done';
        });
      }
    }"
  >

    <!-- Left sidebar: Controls -->
    <aside class="w-72 min-w-[18rem] h-full min-h-0 bg-base-200 overflow-y-auto overscroll-contain p-4 flex flex-col gap-3 border-r border-base-300">

      <!-- 0. Presets -->
      <div class="collapse collapse-arrow bg-base-300 rounded-lg">
        <input type="checkbox" checked />
        <div class="collapse-title font-semibold text-sm">Presets</div>
        <div class="collapse-content flex flex-col gap-1">
          <button class="btn btn-sm btn-outline w-full justify-start" @click="loadPreset('straight')">
            <span class="text-xs">Straight (sanity)</span>
          </button>
          <button class="btn btn-sm btn-outline w-full justify-start" @click="loadPreset('lane_change')">
            <span class="text-xs">Lane Change</span>
          </button>
          <button class="btn btn-sm btn-outline w-full justify-start" @click="loadPreset('s_curve')">
            <span class="text-xs">S-Curve</span>
          </button>
          <button class="btn btn-sm btn-outline w-full justify-start" @click="loadPreset('slalom')">
            <span class="text-xs">Slalom</span>
          </button>
        </div>
      </div>

      <!-- 1. Dynamics Selection -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Dynamics Model</span>
        </label>
        <select class="select select-bordered w-full" x-model="dynamics" @change="updateDynamicsKwargs()">
          <template x-for="(info, name) in dynamicsInfo" :key="name">
            <option :value="name" x-text="name"></option>
          </template>
          <!-- Fallback when dynamicsInfo hasn't loaded yet -->
          <template x-if="Object.keys(dynamicsInfo).length === 0">
            <option value="holonomic">holonomic</option>
          </template>
        </select>
      </div>

      <!-- 2. Dynamics-specific params -->
      <div x-show="Object.keys(dynamicsKwargs).length > 0" class="collapse collapse-arrow bg-base-300 rounded-lg">
        <input type="checkbox" checked />
        <div class="collapse-title font-semibold text-sm">Dynamics Params</div>
        <div class="collapse-content flex flex-col gap-1">
          <template x-for="(val, key) in dynamicsKwargs" :key="key">
            <div class="form-control">
              <label class="label py-0.5">
                <span class="label-text text-xs" x-text="key"></span>
                <span class="label-text-alt text-xs font-mono" x-text="dynamicsKwargs[key]"></span>
              </label>
              <input type="range" class="range range-xs range-primary" :min="0.01" :max="2.0" :step="0.01" x-model.number="dynamicsKwargs[key]" />
            </div>
          </template>
        </div>
      </div>

      <!-- 3. MPPI Params -->
      <div class="collapse collapse-arrow bg-base-300 rounded-lg">
        <input type="checkbox" checked />
        <div class="collapse-title font-semibold text-sm">MPPI Params</div>
        <div class="collapse-content flex flex-col gap-1">
          <!-- backend -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">backend</span>
            </label>
            <select class="select select-bordered select-xs w-full" x-model="backend">
              <option value="spline">spline (original)</option>
              <option value="torch">torch (adaptive cov/temp)</option>
            </select>
          </div>
          <!-- dt -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">dt</span>
              <span class="label-text-alt text-xs font-mono" x-text="dt"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="0.01" max="0.5" step="0.01" x-model.number="dt" />
          </div>
          <!-- n_rollouts -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">n_rollouts</span>
              <span class="label-text-alt text-xs font-mono" x-text="n_rollouts"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="256" max="4096" step="256" x-model.number="n_rollouts" />
          </div>
          <!-- sigma -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">sigma</span>
              <span class="label-text-alt text-xs font-mono" x-text="sigma"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="0.01" max="1.0" step="0.01" x-model.number="sigma" />
          </div>
          <!-- steer_sigma -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">steer_sigma</span>
              <span class="label-text-alt text-xs font-mono" x-text="steer_sigma"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="0.005" max="0.3" step="0.005" x-model.number="steer_sigma" />
          </div>
          <!-- lam (lambda) -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">lam</span>
              <span class="label-text-alt text-xs font-mono" x-text="lam"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="0.001" max="0.5" step="0.001" x-model.number="lam" />
          </div>
          <!-- horizon_knots -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">horizon_knots</span>
              <span class="label-text-alt text-xs font-mono" x-text="horizon_knots"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="2" max="20" step="1" x-model.number="horizon_knots" />
          </div>
          <!-- num_intermediate -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">num_intermediate</span>
              <span class="label-text-alt text-xs font-mono" x-text="num_intermediate"></span>
            </label>
            <input type="range" class="range range-xs range-primary" min="1" max="10" step="1" x-model.number="num_intermediate" />
          </div>
        </div>
      </div>

      <!-- 4. Cost Weights -->
      <div class="collapse collapse-arrow bg-base-300 rounded-lg">
        <input type="checkbox" checked />
        <div class="collapse-title font-semibold text-sm">Cost Weights</div>
        <div class="collapse-content flex flex-col gap-1">
          <!-- goal_pos_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">goal_pos_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="goal_pos_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="10000" step="50" x-model.number="goal_pos_weight" />
          </div>
          <!-- goal_heading_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">goal_heading_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="goal_heading_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="500" step="1" x-model.number="goal_heading_weight" />
          </div>
          <!-- goal_vel_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">goal_vel_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="goal_vel_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="500" step="5" x-model.number="goal_vel_weight" />
          </div>
          <!-- collision_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">collision_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="collision_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="500" step="1" x-model.number="collision_weight" />
          </div>
          <!-- collision_decay -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">collision_decay</span>
              <span class="label-text-alt text-xs font-mono" x-text="collision_decay"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0.1" max="20" step="0.1" x-model.number="collision_decay" />
          </div>
          <!-- collision_inside_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">collision_inside_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="collision_inside_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="2000" step="10" x-model.number="collision_inside_weight" />
          </div>
          <!-- smoothness_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">smoothness_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="smoothness_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="100" step="1" x-model.number="smoothness_weight" />
          </div>
          <!-- terminal_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">terminal_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="terminal_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="50" step="1" x-model.number="terminal_weight" />
          </div>
          <!-- control_reg_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">control_reg_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="control_reg_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="5" step="0.05" x-model.number="control_reg_weight" />
          </div>
          <!-- sign_change_weight -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">sign_change_weight</span>
              <span class="label-text-alt text-xs font-mono" x-text="sign_change_weight"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="500" step="5" x-model.number="sign_change_weight" />
          </div>
          <!-- gamma_sigma (adaptive covariance rate) -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">gamma_sigma (cov adapt)</span>
              <span class="label-text-alt text-xs font-mono" x-text="gamma_sigma"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="1.0" step="0.05" x-model.number="gamma_sigma" />
          </div>
          <!-- cov_floor -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">cov_floor (kappa)</span>
              <span class="label-text-alt text-xs font-mono" x-text="cov_floor"></span>
            </label>
            <input type="range" class="range range-xs range-secondary" min="0" max="0.05" step="0.001" x-model.number="cov_floor" />
          </div>
        </div>
      </div>

      <!-- 5. Map Settings -->
      <div class="collapse collapse-arrow bg-base-300 rounded-lg">
        <input type="checkbox" checked />
        <div class="collapse-title font-semibold text-sm">Map Settings</div>
        <div class="collapse-content flex flex-col gap-1">
          <!-- use_global_planner -->
          <div class="form-control">
            <label class="label cursor-pointer py-0.5">
              <span class="label-text text-xs">Global Planner</span>
              <input type="checkbox" class="toggle toggle-xs toggle-accent" x-model="use_global_planner" />
            </label>
          </div>
          <!-- global_planner_type -->
          <div class="form-control" x-show="use_global_planner">
            <select class="select select-bordered select-xs w-full" x-model="global_planner_type">
              <option value="rrt">RRT (fast, geometric)</option>
              <option value="hybrid_astar">Hybrid A* (dynamics-feasible)</option>
            </select>
          </div>
          <!-- resolution -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">resolution</span>
              <span class="label-text-alt text-xs font-mono" x-text="resolution"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="0.02" max="0.2" step="0.01" x-model.number="resolution" />
          </div>
          <!-- inflate_radius -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">inflate_radius</span>
              <span class="label-text-alt text-xs font-mono" x-text="inflate_radius"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="0" max="0.5" step="0.01" x-model.number="inflate_radius" />
          </div>
          <!-- stop_threshold -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">stop_threshold</span>
              <span class="label-text-alt text-xs font-mono" x-text="stop_threshold"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="0.01" max="0.5" step="0.01" x-model.number="stop_threshold" />
          </div>
          <!-- goal_tolerance -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">goal_tolerance</span>
              <span class="label-text-alt text-xs font-mono" x-text="goal_tolerance"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="0.01" max="0.5" step="0.01" x-model.number="goal_tolerance" />
          </div>
          <!-- replan_interval -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">replan_interval</span>
              <span class="label-text-alt text-xs font-mono" x-text="replan_interval"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="1" max="20" step="1" x-model.number="replan_interval" />
          </div>
          <!-- max_steps -->
          <div class="form-control">
            <label class="label py-0.5">
              <span class="label-text text-xs">max_steps</span>
              <span class="label-text-alt text-xs font-mono" x-text="max_steps"></span>
            </label>
            <input type="range" class="range range-xs range-accent" min="50" max="1000" step="50" x-model.number="max_steps" />
          </div>
        </div>
      </div>

      <!-- 6. Drawing Tools -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Drawing Tools</span>
        </label>
        <div class="join w-full">
          <button class="join-item btn btn-sm flex-1" :class="drawMode === 'rect' ? 'btn-primary' : 'btn-ghost'" @click="drawMode = 'rect'" title="Rectangle">
            &#9645;
          </button>
          <button class="join-item btn btn-sm flex-1" :class="drawMode === 'circle' ? 'btn-primary' : 'btn-ghost'" @click="drawMode = 'circle'" title="Circle">
            &#9675;
          </button>
          <button class="join-item btn btn-sm flex-1" :class="drawMode === 'start' ? 'btn-success' : 'btn-ghost'" @click="drawMode = 'start'" title="Start Pose">
            &#9654;
          </button>
          <button class="join-item btn btn-sm flex-1" :class="drawMode === 'goal' ? 'btn-error' : 'btn-ghost'" @click="drawMode = 'goal'" title="Goal Pose">
            &#9733;
          </button>
          <button class="join-item btn btn-sm flex-1" :class="drawMode === 'erase' ? 'btn-warning' : 'btn-ghost'" @click="drawMode = 'erase'" title="Erase">
            &#10005;
          </button>
        </div>
      </div>

      <!-- Spacer to push buttons to bottom -->
      <div class="flex-1"></div>

      <!-- 7. Action Buttons -->
      <div class="flex flex-col gap-2">
        <button class="btn btn-primary w-full" @click="startPlanning()" :disabled="planning || playing">
          <span x-show="!planning">Plan &amp; Go</span>
          <span x-show="planning" class="loading loading-spinner loading-sm"></span>
        </button>
        <button class="btn btn-accent w-full" @click="playAnimation()" :disabled="!canPlay || planning || playing" x-show="canPlay">
          <span x-show="!playing">&#9654; Play</span>
          <span x-show="playing" class="loading loading-spinner loading-sm"></span>
        </button>
        <button class="btn btn-ghost w-full" @click="clearAll()">Clear All</button>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <section class="flex-1 flex flex-col p-4 min-w-0 overflow-hidden">
      <div id="konva-container" class="w-full flex-1 bg-base-300 rounded-lg"></div>
    </section>

    <!-- Right sidebar: Results -->
    <aside class="w-64 min-w-[16rem] h-full min-h-0 bg-base-200 p-3 flex flex-col gap-2 border-l border-base-300 shrink-0 overflow-y-auto overscroll-contain">

      <!-- Status Bar (compact) -->
      <div class="flex gap-2 text-xs">
        <div class="badge badge-ghost flex-1 justify-between px-2 py-3">
          <span class="opacity-60">Step</span>
          <span class="font-mono" x-text="currentStep"></span>
        </div>
        <div class="badge badge-ghost flex-1 justify-between px-2 py-3">
          <span class="opacity-60">Err</span>
          <span class="font-mono" x-text="posError !== null ? posError.toFixed(3) : '\u2014'"></span>
        </div>
        <div class="badge badge-ghost flex-1 justify-between px-2 py-3">
          <span class="opacity-60" x-text="statusText"></span>
        </div>
      </div>

      <!-- Distance Chart (fixed height) -->
      <div class="bg-base-300 rounded-lg p-2">
        <h3 class="text-xs font-semibold opacity-60 mb-1">Distance to Goal</h3>
        <div style="height:140px; position:relative;">
          <canvas id="distChart"></canvas>
        </div>
      </div>

      <!-- Action Chart (fixed height) -->
      <div class="bg-base-300 rounded-lg p-2">
        <h3 class="text-xs font-semibold opacity-60 mb-1">Actions</h3>
        <div style="height:140px; position:relative;">
          <canvas id="actionChart"></canvas>
        </div>
      </div>
    </aside>

  </main>

  <!-- Scripts: load before Alpine (which is deferred) -->
  <script src="/static/charts.js"></script>
  <script src="/static/planner.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
