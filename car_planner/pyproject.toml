[project]
name = "car-planner"
version = "0.0.1"
description = "car planner"
requires-python = ">=3.10"
authors = [
    { name = "Wenli Xiao", email = "wxiao2@andrew.cmu.edu" },
]
dependencies = [
    "numpy",
    "casadi",
    "scipy",
    "jax-cosmo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["car_planner"]
