[project]
name = "car-dynamics"
version = "0.0.1"
description = "Tools for RC Car Dynamics, Controllers, and Collision Avoidance"
requires-python = ">=3.10"
authors = [
    { name = "Wenli Xiao", email = "wxiao2@andrew.cmu.edu" },
]
dependencies = [
    "jax[cuda12]",
    "flax",
    "jax-cosmo",
    "scipy",
    "numpy",
    "termcolor",
    "rich",
    "pandas",
    "mujoco",
    "car-foundation",
    "portal==3.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["car_dynamics"]
