[project]
name = "car-collect"
version = "0.0.1"
description = "car collect"
requires-python = ">=3.10"
authors = [
    { name = "Wenli Xiao", email = "wxiao2@andrew.cmu.edu" },
]
dependencies = [
    "ray",
    "matplotlib",
    "jupyterlab",
    "pyproj",
    "ipywidgets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mujoco_collect", "numeric_collect", "assetto_corsa_collect", "isaacsim_collect"]
